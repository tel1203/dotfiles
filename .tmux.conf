# ~/.tmux.conf
# Mac / Raspberry Pi 共通設定

##### Basic ########################################################

# copy-mode は vi キーバインド
set-window-option -g mode-keys vi

# Window / Pane の番号を 1 から開始
set-option -g base-index 1
set-window-option -g pane-base-index 1

# ウィンドウ名を自動変更する
set-window-option -g automatic-rename on

# 現行 tmux のマウス設定
set-option -g mouse on

# Prefix は Mac / RPI ともデフォルトの Ctrl-b に統一
set-option -g prefix C-b
unbind-key C-z
bind-key C-b send-prefix


##### Status / appearance ##########################################

set-option -g status on
set-option -g status-style "bg=black,fg=yellow"
set-option -g status-right "[%m/%d %H:%M]"

set-option -g message-style "bg=black,fg=brightred"

set-window-option -g window-status-style "fg=white,bg=default"
set-window-option -g window-status-current-style "fg=brightred,bg=default,bold"

set-window-option -g clock-mode-colour green
set-window-option -g clock-mode-style 24

set-option -g visual-activity on

# Pane border
set-option -g pane-border-style "fg=colour240"
set-option -g pane-active-border-style "fg=red"
set-option -g pane-border-lines heavy

# Ctrl-b q で表示される Pane 番号
set-option -g display-panes-active-colour green
set-option -g display-panes-colour brightred


##### Prefix-based operations #####################################

# Prefix + \ で左右分割、Prefix + - で上下分割
# 新しい Pane は現在の Pane と同じディレクトリで開始
unbind-key |
bind-key '\' split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Prefix + Ctrl-h/l で前後の Window に移動
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# Prefix + h/j/k/l でも Pane を移動
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Prefix + H/J/K/L で Pane サイズ変更
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Prefix + r で設定を再読み込み
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"


##### Alt direct operations ########################################
# Prefix 不要。RPI で使っている操作体系と統一。
# 旧設定の Ctrl-o ペイン巡回を解除
unbind-key -n C-o


# Alt-\ で左右分割、Alt-- で上下分割
bind-key -n 'M-\' split-window -h -c "#{pane_current_path}"
bind-key -n M-- split-window -v -c "#{pane_current_path}"

# Alt-w で現在の Pane を閉じる
bind-key -n M-w kill-pane
bind-key -n M-W kill-window

# Alt-h/j/k/l で Pane 移動
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Alt-H/J/K/L で Pane サイズ変更
# Prefix + H/J/K/L と同じ方向・同じ 5 セル単位
bind-key -n M-H resize-pane -L 5
bind-key -n M-J resize-pane -D 5
bind-key -n M-K resize-pane -U 5
bind-key -n M-L resize-pane -R 5

# Alt-o で現在の Pane を最大化 / 元に戻す
bind-key -n M-o resize-pane -Z

# Alt-c で copy-mode、Alt-v で最新 buffer 貼付、
# Alt-p で buffer 一覧から選択
bind-key -n M-c copy-mode
bind-key -n M-v paste-buffer
bind-key -n M-p choose-buffer -Z

